# Flashlight — Local AI Ecosystem
#
# Single source of truth for the supervisor and all specialist agents.
# Every model listed here runs locally under Ollama. The Python layer
# builds the supervisor's routing prompt from this registry, so adding
# an agent here (plus a Modelfile) is all that is needed to extend the
# ecosystem.

ollama_host: "http://localhost:11434"

# How many times the supervisor may retry producing valid routing JSON
# before the run aborts with an error. There is NO keyword fallback and
# NO canned response — routing is always a real model inference.
routing_retries: 2

supervisor:
  model: local-supervisor
  base: qwen2.5:1.5b
  modelfile: modelfiles/supervisor.Modelfile

agents:
  coder:
    model: local-coder
    base: qwen2.5:1.5b
    modelfile: modelfiles/coder.Modelfile
    description: >
      Full-stack software development: Python, JavaScript, TypeScript,
      React, FastAPI, Node, SQL; debugging, refactoring, tests and repo
      analysis.
    tools: []

  unreal:
    model: local-unreal
    base: qwen2.5:1.5b
    modelfile: modelfiles/unreal.Modelfile
    description: >
      Unreal Engine 5 game development: Blueprints, C++, Python editor
      automation, level creation, actors, materials, lights, cameras
      and editor scripting.
    tools: []

  sysadmin_security:
    model: local-sysadmin-security
    base: qwen2.5:1.5b
    modelfile: modelfiles/sysadmin_security.Modelfile
    description: >
      System administration and defensive security: Linux administration,
      Windows troubleshooting, networking, Docker, SSH, firewalls, backups,
      local hardening and authorized diagnostics.
    tools: []

  data_analytics:
    model: local-data-analytics
    base: qwen2.5:1.5b
    modelfile: modelfiles/data_analytics.Modelfile
    description: >
      Data analytics: CSV/JSON/Excel-style analysis, pandas, statistics,
      charts, data cleaning, business analysis and pattern detection.
    tools: []

  web_seo:
    model: local-web-seo
    base: qwen2.5:1.5b
    modelfile: modelfiles/web_seo.Modelfile
    description: >
      Web hosting and SEO: website planning, landing pages, copywriting,
      SEO structure, domains, hosting, local business lead funnels and
      conversion optimization.
    tools: []

  finance_crypto:
    model: local-finance-crypto
    base: qwen2.5:1.5b
    modelfile: modelfiles/finance_crypto.Modelfile
    description: >
      Financial and crypto tracking: live cryptocurrency prices, stock
      quotes, paper trading, portfolio summaries, risk metrics and
      market data interpretation.
    tools: [get_crypto_price, get_stock_quote]

  research:
    model: local-research
    base: qwen2.5:1.5b
    modelfile: modelfiles/research.Modelfile
    description: >
      Knowledge research: technical research, document review, source
      comparison, summaries, fact extraction and timeline building.
    tools: []

  media_transcription:
    model: local-media-transcription
    base: qwen2.5:1.5b
    modelfile: modelfiles/media_transcription.Modelfile
    description: >
      Media and transcription: transcribing local audio files with
      Whisper, captions, scripts, voiceover copy, content repurposing
      and media file organization.
    tools: [transcribe_audio]

  devops_cloud:
    model: local-devops-cloud
    base: qwen2.5:1.5b
    modelfile: modelfiles/devops_cloud.Modelfile
    description: >
      DevOps and cloud automation: deployment, CI/CD, Docker Compose,
      GitHub Actions, VPS setup, reverse proxies, environment variables,
      logs and monitoring.
    tools: []

  general_assistant:
    model: local-general-assistant
    base: qwen2.5:1.5b
    modelfile: modelfiles/general_assistant.Modelfile
    description: >
      General assistant and fallback route: everyday planning,
      explanations, summaries, user support, simple decisions and
      catch-all tasks that do not require a specialist.
    tools: []
