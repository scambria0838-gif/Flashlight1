# Flashlight — Local AI Ecosystem
#
# Single source of truth for the supervisor and all specialist agents.
# Every model listed here runs locally under Ollama. The Python layer
# builds the supervisor's routing prompt from this registry, so adding
# an agent here (plus a Modelfile) is all that is needed to extend the
# ecosystem.

ollama_host: "http://localhost:11434"

# How many times the supervisor may retry producing valid routing JSON
# before the run aborts with an error. There is NO keyword fallback and
# NO canned response — routing is always a real model inference.
routing_retries: 2

supervisor:
  model: flashlight-supervisor
  base: qwen2.5:7b-instruct
  modelfile: modelfiles/supervisor.Modelfile

agents:
  coder:
    model: flashlight-coder
    base: qwen2.5-coder:7b
    modelfile: modelfiles/coder.Modelfile
    description: >
      Software development: writing, reviewing, refactoring and debugging
      code in any language; build systems; APIs; algorithms; tests.
    tools: []

  unreal:
    model: flashlight-unreal
    base: qwen2.5-coder:7b
    modelfile: modelfiles/unreal.Modelfile
    description: >
      Unreal Engine game development: C++ gameplay code, Blueprints,
      Niagara, materials, replication/netcode, packaging, performance
      profiling and editor tooling.
    tools: []

  sysadmin:
    model: flashlight-sysadmin
    base: llama3.1:8b
    modelfile: modelfiles/sysadmin.Modelfile
    description: >
      System administration and defensive security: Linux/Windows server
      management, networking, firewalls, hardening, log analysis, backup
      strategy, incident response and monitoring.
    tools: []

  analytics:
    model: flashlight-analytics
    base: qwen2.5:7b-instruct
    modelfile: modelfiles/analytics.Modelfile
    description: >
      Data analytics: SQL, pandas, statistics, data cleaning, ETL design,
      visualization guidance and interpreting datasets or metrics.
    tools: []

  webseo:
    model: flashlight-webseo
    base: llama3.1:8b
    modelfile: modelfiles/webseo.Modelfile
    description: >
      Web hosting and SEO: DNS, TLS, nginx/Apache/Caddy configuration,
      CDNs, Core Web Vitals, on-page/technical SEO, sitemaps and
      structured data.
    tools: []

  finance:
    model: flashlight-finance
    base: qwen2.5:7b-instruct
    modelfile: modelfiles/finance.Modelfile
    description: >
      Financial and crypto tracking: live cryptocurrency prices, stock
      quotes, portfolio arithmetic, market terminology and general
      personal-finance explanations.
    tools: [get_crypto_price, get_stock_quote]

  research:
    model: flashlight-research
    base: llama3.1:8b
    modelfile: modelfiles/research.Modelfile
    description: >
      Knowledge research: in-depth explanations, literature-style
      summaries, comparing viewpoints, history, science and structured
      deep dives into any topic.
    tools: []

  media:
    model: flashlight-media
    base: llama3.1:8b
    modelfile: modelfiles/media.Modelfile
    description: >
      Media and transcription management: transcribing local audio files
      with Whisper, media library organization, ffmpeg commands, codecs,
      subtitles and metadata.
    tools: [transcribe_audio]

  home:
    model: flashlight-home
    base: llama3.2:3b
    modelfile: modelfiles/home.Modelfile
    description: >
      Residential maintenance: plumbing, electrical basics, HVAC,
      appliances, seasonal upkeep schedules, repair-vs-replace decisions
      and when to call a licensed professional.
    tools: []

  general:
    model: flashlight-general
    base: llama3.2:3b
    modelfile: modelfiles/general.Modelfile
    description: >
      General assistant and fallback route: everyday questions, writing
      help and any task that does not clearly belong to another
      specialist.
    tools: []
